name: Proposer des ressources anglaises
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: content-review
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/collect-content.mjs
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: ressources-a-verifier
          path: content/pending.json
          retention-days: 30
      - run: node scripts/propose-content.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
